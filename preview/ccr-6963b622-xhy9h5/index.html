<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#08090f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Shattered Sovereigns — turn-based Rift Timeline battles across shattered worlds."
    />
    <title>Shattered Sovereigns</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-BcKuPDaT.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/CanvasPool-Dkl10nkw.js">
    <link rel="modulepreload" crossorigin href="./assets/canvasUtils-BNVjW89d.js">
    <link rel="modulepreload" crossorigin href="./assets/RenderTargetSystem-kExQeus0.js">
    <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-DmobWu4X.js">
    <link rel="modulepreload" crossorigin href="./assets/BufferResource-DkritBPQ.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CvrrPgVD.css">
  </head>
  <body data-scene="boot" data-paused="false">
    <div id="game-root" class="game-root"></div>

    <section id="boot-screen" class="boot-screen">
      <div class="boot-title">
        <p class="kicker">Rift Timeline · Battlefield test</p>
        <h1>Shattered Sovereigns</h1>
      </div>
      <button id="start-button" class="button-primary" type="button" disabled>Loading…</button>
      <p id="boot-build" class="build-tag"></p>
    </section>

    <p id="arena-hint" class="panel-ink arena-hint" hidden>
      Tap a Sovereign or an enemy to select it
    </p>

    <section id="rotate-prompt" class="rotate-prompt" aria-live="polite">
      <div class="rotate-phone" aria-hidden="true"></div>
      <p>Turn your phone upright to play</p>
    </section>

    <section id="error-panel" class="error-panel panel-light" role="alert" hidden>
      <h2>Something went wrong</h2>
      <p>Copy the details and send them to Claude so it can be fixed.</p>
      <pre id="error-message"></pre>
      <div class="error-actions">
        <button id="error-copy" class="button-primary" type="button">Copy details</button>
        <button id="error-dismiss" class="button-quiet" type="button">Dismiss</button>
      </div>
    </section>

  </body>
</html>
